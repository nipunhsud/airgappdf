<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merge PDF files online free — no upload | AirgapPDF</title>
<meta name="description" content="Combine multiple PDF files into one, free and private. Files never leave your browser.">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "pdf-lib": "https://esm.sh/pdf-lib@1.17.1" } }</script>
</head>
<body>
<header><a class="logo" href="index.html">Airgap<em>PDF</em></a><a href="index.html">All tools</a></header>
<main>
  <h1>Merge PDFs</h1>
  <div class="tool">
    <label>Select two or more PDFs (order = merge order)</label>
    <input type="file" id="files" accept="application/pdf" multiple>
    <button id="go">Merge &amp; download</button>
    <div id="status" class="status"></div>
  </div>
  <div class="ad-slot">Ad slot — 728×90</div>
</main>
<script type="module">
import { mergePdfs } from './pdf-tools.mjs';
import { download, run, setStatus } from './ui.js';

document.getElementById('go').onclick = () => run(async () => {
  const files = [...document.getElementById('files').files];
  if (files.length < 2) throw new Error('Pick at least two PDFs.');
  const buffers = await Promise.all(files.map(f => f.arrayBuffer()));
  download(await mergePdfs(buffers), 'merged.pdf');
});
</script>
</body>
</html>
