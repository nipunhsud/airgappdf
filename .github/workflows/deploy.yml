# Deploys the site to Cloudflare Pages on every push to main.
# Requires two repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — token with the "Cloudflare Pages — Edit" permission
#   CLOUDFLARE_ACCOUNT_ID — from the Cloudflare dashboard sidebar
# One-time setup: create the project with `npx wrangler pages project create airgappdf`.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Assemble static site
        run: |
          mkdir dist dist/docs
          cp *.html style.css ui.js formats.js ads.js ads.txt pdf-tools.mjs favicon.svg robots.txt sitemap.xml llms.txt dist/
          cp docs/screenshot.png dist/docs/

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=airgappdf
