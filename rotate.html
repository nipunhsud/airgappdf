<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotate PDF pages online free — no upload | AirgapPDF</title>
<meta name="description" content="Rotate all pages of a PDF by 90, 180 or 270 degrees, free and private.">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "pdf-lib": "https://esm.sh/pdf-lib@1.17.1" } }</script>
</head>
<body>
<header><a class="logo" href="index.html">Airgap<em>PDF</em></a><a href="index.html">All tools</a></header>
<main>
  <h1>Rotate PDF</h1>
  <div class="tool">
    <label>PDF file</label>
    <input type="file" id="file" accept="application/pdf">
    <label>Rotation</label>
    <select id="angle">
      <option value="90">90° clockwise</option>
      <option value="180">180°</option>
      <option value="270">90° counter-clockwise</option>
    </select>
    <button id="go">Rotate &amp; download</button>
    <div id="status" class="status"></div>
  </div>
  <div class="ad-slot">Ad slot — 728×90</div>
</main>
<script type="module">
import { rotatePdf } from './pdf-tools.mjs';
import { download, run } from './ui.js';

document.getElementById('go').onclick = () => run(async () => {
  const f = document.getElementById('file').files[0];
  if (!f) throw new Error('Pick a PDF.');
  const angle = +document.getElementById('angle').value;
  download(await rotatePdf(await f.arrayBuffer(), angle), 'rotated.pdf');
});
</script>
</body>
</html>
