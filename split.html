<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split PDF — extract pages online free, no upload | PDFRage</title>
<meta name="description" content="Extract pages or page ranges from a PDF, free and private. Files never leave your browser.">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "pdf-lib": "https://esm.sh/pdf-lib@1.17.1" } }</script>
</head>
<body>
<header><a class="logo" href="index.html">PDF<em>Rage</em></a><a href="index.html">All tools</a></header>
<main>
  <h1>Split PDF</h1>
  <div class="tool">
    <label>PDF file</label>
    <input type="file" id="file" accept="application/pdf">
    <label>Pages to keep, e.g. <code>1-3,5</code></label>
    <input type="text" id="ranges" placeholder="1-3,5">
    <button id="go">Extract &amp; download</button>
    <div id="status" class="status"></div>
  </div>
  <div class="ad-slot">Ad slot — 728×90</div>
</main>
<script type="module">
import { extractPages } from './pdf-tools.mjs';
import { download, run } from './ui.js';

document.getElementById('go').onclick = () => run(async () => {
  const f = document.getElementById('file').files[0];
  if (!f) throw new Error('Pick a PDF.');
  const spec = document.getElementById('ranges').value.trim();
  if (!spec) throw new Error('Enter a page range.');
  download(await extractPages(await f.arrayBuffer(), spec), 'extracted.pdf');
});
</script>
</body>
</html>
